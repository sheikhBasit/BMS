version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - instance_data:/app/instance
      - uploads_data:/app/static/uploads
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///instance/bms.db

volumes:
  instance_data:
  uploads_data:
