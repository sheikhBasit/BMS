{% extends 'base.html' %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card" data-tilt>
        <h1 style="text-align: center; font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Login to your account</p>

        <form method="POST">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
            <div style="position: relative; margin-bottom: 1rem;">
                <input type="password" name="password" id="password" placeholder="Enter your password" required
                    style="padding-right: 45px;">
                <i class="fas fa-eye" id="togglePassword"
                    style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); transition: 0.3s; z-index: 10;"></i>
            </div>

            <div style="display: flex; align-items: center; margin-bottom: 1rem;">
                <input type="checkbox" name="remember" style="width: auto; margin: 0 0.5rem 0 0; box-shadow: none;">
                <label style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0;">Remember Me</label>
            </div>

            <button type="submit" style="margin-top: 1rem;">Login</button>
        </form>

        <script>
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#password');

            togglePassword.addEventListener('click', function (e) {
                // toggle the type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                // toggle the eye slash icon
                this.classList.toggle('fa-eye-slash');
            });
        </script>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary);">Register</a>
        </p>
    </div>
</div>
{% endblock %}
