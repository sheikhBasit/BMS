{% extends 'base.html' %}
{% block body_class %}page-register{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card" data-tilt>
        <h1 style="text-align: center;">Register</h1>
        <p style="text-align: center; color: var(--text-muted);">Join the community</p>
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" minlength="3" maxlength="20"
                pattern="[a-zA-Z0-9_]+" title="Username: 3-20 characters (letters, numbers, underscore only)" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <div style="position: relative; margin-bottom: 1rem;">
                <input type="password" name="password" id="password" placeholder="Create a password" minlength="6"
                    title="Password must be at least 6 characters" required style="padding-right: 45px;">
                <i class="fas fa-eye" id="togglePassword"
                    style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); transition: 0.3s; z-index: 10;"></i>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <script>
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#password');

            togglePassword.addEventListener('click', function (e) {
                // toggle the type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                // toggle the eye slash icon
                this.classList.toggle('fa-eye-slash');
            });
        </script>
        <p style="text-align: center; margin-top: 1rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary);">Login</a>
        </p>
    </div>
</div>
{% endblock %}
