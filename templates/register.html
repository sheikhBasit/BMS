{% extends 'base.html' %}
{% block body_class %}page-register{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card" data-tilt>
        <h1 style="text-align: center;">Register</h1>
        <p style="text-align: center; color: var(--text-muted);">Join the community</p>
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <!-- Role selection removed as per requirement -->

            <button type="submit">Create Account</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary);">Login</a>
        </p>
    </div>
</div>
{% endblock %}
